repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(notebooks/_freeze/|docs/notebooks/html/)
      - id: end-of-file-fixer
        exclude: ^(notebooks/_freeze/|docs/notebooks/html/)
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-added-large-files
        name: check-generated-artifact-size
        args: ["--maxkb=5000"]
        files: ^(docs/notebooks/html/|notebooks/_freeze/)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.15
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --skip-editable --ignore-vuln CVE-2026-1839 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2025-69872 --ignore-vuln GHSA-xqmj-j6mv-4862 --ignore-vuln CVE-2026-44307 --ignore-vuln CVE-2026-6357 --ignore-vuln CVE-2026-44431 --ignore-vuln CVE-2026-44432
        language: system
        always_run: true
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy src/novelentitymatcher
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: quarto-render
        name: Render changed .qmd notebooks
        entry: make notebooks-staged
        language: system
        files: '^notebooks/.*\.qmd$'
        pass_filenames: false
